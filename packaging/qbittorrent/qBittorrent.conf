# qBittorrent settings for MovieBot, installed as
# /srv/moviebot/.config/qBittorrent/qBittorrent.conf before qBittorrent first starts.
#
# The web interface listens on this machine only, and requests from this machine need no
# password, which is how MovieBot talks to it.

[LegalNotice]
Accepted=true

[Preferences]
WebUI\Address=127.0.0.1
WebUI\Port=8080
WebUI\LocalHostAuth=false

[BitTorrent]
Session\DefaultSavePath=/srv/moviebot/downloads
