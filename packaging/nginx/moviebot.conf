# MovieBot nginx site.
#
# Replace movies.example.com with your domain, then run:
#   sudo certbot --nginx -d movies.example.com
# certbot adds the https listener and the certificate to this file.
#
# One address serves the player, the API, the films and the live connection, because a Discord
# Activity is mapped to a single address.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen      [::]:80;
    server_name movies.example.com;

    client_max_body_size 1m;

    # The live connection that keeps a room in step. It stays open for the whole film.
    location /hub/ {
        proxy_pass         http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Films, subtitles and posters. Buffering stays off because a film that is still being
    # prepared grows while it is read.
    location /media/ {
        proxy_pass         http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # A file attached to a message for the assistant: up to 8 MB, the most an upload may be. The
    # other routes keep the 1m above.
    location = /assistant/attachments {
        client_max_body_size 8m;
        proxy_pass         http://127.0.0.1:8191/attachments;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_read_timeout 120s;
    }

    # The assistant. Its answers arrive as a stream that can sit quiet while the model works, so
    # nothing is buffered and the connection is allowed to wait.
    location /assistant/ {
        proxy_pass         http://127.0.0.1:8191/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    # The player and the API.
    location / {
        proxy_pass         http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_read_timeout 120s;
    }
}
