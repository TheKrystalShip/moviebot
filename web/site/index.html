<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Krystal Cinema</title>
    <meta name="description" content="Watch films together, on one shared timeline." />
    <meta name="theme-color" content="#0B0F14" />

    <!-- The manifest is what Android's "Install app" reads. It names no orientation: any value there
         overrides the phone's own rotation lock in the installed app. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Safari reads none of the manifest's install details; these are its home-screen title and
         standalone behaviour. The icons, the launch screens and the splash are the design system's
         (siteIdentity in vite.config.js). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black: the status bar is black and the page starts below it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Cinema" />
    <meta name="application-name" content="Cinema" />
    <!-- Keeps iOS from turning a year, a runtime or a count in the text into a tap target. -->
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />

    <!-- Discord launches the Activity at the address its URL mapping names, which is the root. A
         load carrying Discord's launch parameters is the Activity's, so its address becomes the
         embed's before the page reads it. -->
    <script>
      (function () {
        if (window.location.pathname === "/" && new URLSearchParams(window.location.search).has("frame_id")) {
          window.history.replaceState(null, "", "/embed/" + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
