<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>MovieBot</title>
  </head>
  <body>
    <div class="app" id="app">
      <main class="app__main">
        <section class="stage">
          <div class="stage__frame">
            <div class="stage__player" id="player"></div>

            <!-- Small enough to ignore while a film is playing, present enough to answer
                 "is it just me" without opening a console. -->
            <span class="stage__status" id="connection">connecting</span>

            <div class="gate" id="gate" hidden>
              <button type="button" class="gate__button" id="gate-button">Join playback</button>
            </div>
          </div>
          <div class="stage__notices" id="notices"></div>
        </section>

        <button
          type="button"
          class="side__toggle"
          id="side-toggle"
          aria-controls="side"
          aria-expanded="true"
          title="Show or hide the library"
        >Library</button>

        <aside class="side" id="side">
          <section class="side__block">
            <h2 class="side__heading">Now playing</h2>
            <div class="playing">
              <span class="playing__title" id="film-title">No film loaded</span>
              <span class="playing__actor" id="actor"></span>
              <span class="playing__session" id="session-label"></span>
            </div>
          </section>
          <section class="side__block">
            <h2 class="side__heading">Library</h2>
            <ul class="library" id="library"></ul>
          </section>
          <section class="side__block">
            <h2 class="side__heading">Watching</h2>
            <ul class="participants" id="participants"></ul>
          </section>
        </aside>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
