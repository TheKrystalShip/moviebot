<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>MovieBot</title>
  </head>
  <body>
    <div class="app" id="app">
      <div class="stage__frame">
        <div class="stage__player" id="player"></div>

        <!-- Invisible while connected; red and readable when it is not. -->
        <span class="stage__status" id="connection">connecting</span>

        <!-- Shown until the bot puts a film in the room. There is no library here on purpose:
             a film is chosen with the slash command, where autocomplete already knows them. -->
        <div class="empty" id="empty">
          <p class="empty__line">Nothing playing yet.</p>
          <p class="empty__hint">Ask the bot for a film with <code>/watch</code>.</p>
        </div>

        <div class="gate" id="gate" hidden>
          <button type="button" class="gate__button" id="gate-button">Join playback</button>
        </div>

        <!-- Transient, over the film: who paused, why a seek was refused, what went wrong.
             Part of playing rather than furniture around it. -->
        <div class="stage__notices" id="notices"></div>
      </div>

      <!-- Kept for the room's state, which the player reads and nobody needs to look at. -->
      <span hidden id="film-title">No film loaded</span>
      <span hidden id="actor"></span>
      <span hidden id="session-label"></span>
      <ul hidden id="library"></ul>
      <ul hidden id="participants"></ul>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
