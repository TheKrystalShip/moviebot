# moviebot — the ingress half, on the machine that holds the public address.
#
# MovieBot runs on hotbox, which is not reachable from outside: there is one public address on
# this network and this machine holds it. So the name is published here and routed on by
# server_name, exactly the way hotbox's own name is, and `nginx-moviebot-ingress.conf` and
# `nginx-moviebot.conf` are deployed to two different hosts.
#
# TLS terminates here on the shared certificate, which carries movies.thekrystalship.com among its
# SANs. The hop across the switch is https to hotbox under hotbox's own name — the certificate on
# the far side is chosen by that SNI while the server block is chosen by the Host header, which
# travels through unchanged.
#
# One origin still serves the page, the API, the media and the SignalR hub, because a Discord
# Activity maps one URL and this machine is where that URL lands.
#
# The certificate is the host's shared lineage, named for the first hostname ever issued on it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name movies.thekrystalship.com;

    # One certificate covers every hostname on this box as SANs; the lineage is named for the
    # first one issued.
    ssl_certificate     /etc/letsencrypt/live/kgsm.thekrystalship.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kgsm.thekrystalship.com/privkey.pem;

    # A film segment is a few megabytes; nothing here is uploaded.
    client_max_body_size 1m;

    # The SignalR hub carrying the room's shared timeline. WebSockets need the upgrade dance,
    # and the read timeout has to outlast a quiet passage of film: the default 60s would drop a
    # connection that is merely watching something without pausing it.
    location /hub/ {
        proxy_pass         https://192.168.1.129:443;
        proxy_http_version 1.1;

        # The upstream is an address, so the name to ask for and check against has to be stated.
        # Verification is on: an unverified proxy_ssl encrypts the hop and authenticates nobody.
        # hotbox answers under its own name, so that is the name checked; the vhost on the far
        # side is selected by the Host header, which travels through unchanged.
        proxy_ssl_server_name       on;
        proxy_ssl_name              hotbox.thekrystalship.com;
        proxy_ssl_verify            on;
        proxy_ssl_verify_depth      3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Playlists, segments, subtitles and posters.
    #
    # Buffering is off because a playlist for a film that is still transcoding grows while it is
    # being read: holding it in a buffer would serve a copy that ends earlier than the file does,
    # which looks to a viewer exactly like a broken transcode. The API sets its own Cache-Control
    # per file — no-store for a growing playlist, immutable for a segment — so nothing here may
    # override it.
    location /media/ {
        proxy_pass         https://192.168.1.129:443;
        proxy_http_version 1.1;

        # The upstream is an address, so the name to ask for and check against has to be stated.
        # Verification is on: an unverified proxy_ssl encrypts the hop and authenticates nobody.
        # hotbox answers under its own name, so that is the name checked; the vhost on the far
        # side is selected by the Host header, which travels through unchanged.
        proxy_ssl_server_name       on;
        proxy_ssl_name              hotbox.thekrystalship.com;
        proxy_ssl_verify            on;
        proxy_ssl_verify_depth      3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # The API, and the player it serves from wwwroot.
    location / {
        proxy_pass         https://192.168.1.129:443;
        proxy_http_version 1.1;

        # The upstream is an address, so the name to ask for and check against has to be stated.
        # Verification is on: an unverified proxy_ssl encrypts the hop and authenticates nobody.
        # hotbox answers under its own name, so that is the name checked; the vhost on the far
        # side is selected by the Host header, which travels through unchanged.
        proxy_ssl_server_name       on;
        proxy_ssl_name              hotbox.thekrystalship.com;
        proxy_ssl_verify            on;
        proxy_ssl_verify_depth      3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        proxy_read_timeout 120s;
    }
}
