# moviebot — the ingress half, on the machine that holds the public address.
#
# MovieBot runs on hotbox, which is not reachable from outside: there is one public address on
# this network and this machine holds it. So the name is published here and routed on by
# server_name, exactly the way hotbox's own name is, and `nginx-moviebot-ingress.conf` and
# `nginx-moviebot.conf` are deployed to two different hosts.
#
# TLS terminates here on the shared certificate, which carries movies.thekrystalship.com among its
# SANs. The hop across the switch is https to hotbox under hotbox's own name — the certificate on
# the far side is chosen by that SNI while the server block is chosen by the Host header, which
# travels through unchanged.
#
# One origin still serves the page, the API, the media and the SignalR hub, because a Discord
# Activity maps one URL and this machine is where that URL lands.
#
# The certificate is the host's shared lineage, named for the first hostname ever issued on it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Segments, held here so a room watching together costs one copy across the switch. Everyone in a
# room asks for the same segment within the same second or two, and one entry answers all of them.
#
# The key is the whole request URI, ticket and all, which is what keeps the cache from becoming a
# way around the lock: a request with no ticket, or a stale one, is a different key, misses, and is
# refused by the API like any other. The ticket is the same string for every viewer of a film, so
# their requests share one entry.
#
# The master process creates this directory at startup, so nothing has to put it there first.
proxy_cache_path /var/lib/nginx/moviebot-media levels=1:2 keys_zone=moviebot_media:16m
                 max_size=20g inactive=7d use_temp_path=off;

# hotbox, with connections held open between requests. Each one costs a TLS handshake across the
# switch, and a page asks for dozens of posters and API calls at once; a held connection answers the
# next of them with none.
upstream moviebot_hotbox {
    server    192.168.1.129:443;
    keepalive 32;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name movies.thekrystalship.com;

    # One certificate covers every hostname on this box as SANs; the lineage is named for the
    # first one issued.
    ssl_certificate     /etc/letsencrypt/live/kgsm.thekrystalship.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kgsm.thekrystalship.com/privkey.pem;

    # A film segment is a few megabytes; nothing here is uploaded.
    client_max_body_size 1m;

    # Text is compressed on the way out: the library listing is JSON several times the size it
    # compresses to, and on a link that drops packets every byte not sent is a byte not resent.
    # Images and segments are compressed already and are left alone, and an event stream is not
    # listed because compressing it holds each frame back until the next fills a block. The site's
    # fonts are TrueType, which halves under gzip; the API names them `application/x-font-ttf`.
    gzip            on;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      application/json application/javascript text/javascript text/css text/plain text/vtt
                    application/vnd.apple.mpegurl application/manifest+json image/svg+xml
                    application/x-font-ttf font/ttf;

    # The SignalR hub carrying the room's shared timeline. WebSockets need the upgrade dance,
    # and the read timeout has to outlast a quiet passage of film: the default 60s would drop a
    # connection that is merely watching something without pausing it.
    location /hub/ {
        proxy_pass         https://moviebot_hotbox;
        proxy_http_version 1.1;

        # The upstream is an address, so the name to ask for and check against has to be stated.
        # Verification is on: an unverified proxy_ssl encrypts the hop and authenticates nobody.
        # hotbox answers under its own name, so that is the name checked; the vhost on the far
        # side is selected by the Host header, which travels through unchanged.
        proxy_ssl_server_name       on;
        proxy_ssl_name              hotbox.thekrystalship.com;
        proxy_ssl_verify            on;
        proxy_ssl_verify_depth      3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Segments and their initialisation segments, which are the whole weight of a film and never
    # change once written. They are split out from the playlists below because caching needs
    # buffering and the playlists need it off: what is immutable can be held, and what grows
    # while it is read cannot.
    #
    # proxy_cache_lock is what makes a room cheap. Five viewers asking for the same segment in the
    # same moment are five simultaneous misses on one key; the lock sends one of them to hotbox and
    # holds the rest until it lands.
    location ~ ^/media/[^/]+/[av][0-9]+/(?:seg[0-9]+\.m4s|init\.mp4)$ {
        proxy_pass         https://moviebot_hotbox;
        proxy_http_version 1.1;

        proxy_ssl_server_name       on;
        proxy_ssl_name              hotbox.thekrystalship.com;
        proxy_ssl_verify            on;
        proxy_ssl_verify_depth      3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        proxy_cache        moviebot_media;

        # A request proving itself with an Authorization header is never stored and never answered
        # from store. The header is not part of the cache key, so a response kept from one would be
        # handed to the next request for that URL whether or not it proved anything. A ticket is
        # safe in the same position precisely because it is in the URL, and so in the key.
        proxy_no_cache     $http_authorization;
        proxy_cache_bypass $http_authorization;

        # Only a whole segment is stored. A range answered 206 passes through uncached; a range
        # against a segment already held is served out of the stored copy without asking.
        proxy_cache_valid  200 7d;
        proxy_cache_lock   on;
        proxy_cache_lock_timeout 30s;
        # A refusal is the API's to give every time, so a viewer whose ticket has since been
        # renewed is not held to the answer an older one got.
        proxy_cache_valid  401 403 404 0;

        add_header X-Cache-Status $upstream_cache_status always;

        proxy_read_timeout 300s;
    }

    # Playlists, subtitles and posters.
    #
    # Buffering is off because a playlist for a film that is still transcoding grows while it is
    # being read: holding it in a buffer would serve a copy that ends earlier than the file does,
    # which looks to a viewer exactly like a broken transcode. The API sets its own Cache-Control
    # per file — no-store for a growing playlist — so nothing here may override it.
    location /media/ {
        proxy_pass         https://moviebot_hotbox;
        proxy_http_version 1.1;

        # The upstream is an address, so the name to ask for and check against has to be stated.
        # Verification is on: an unverified proxy_ssl encrypts the hop and authenticates nobody.
        # hotbox answers under its own name, so that is the name checked; the vhost on the far
        # side is selected by the Host header, which travels through unchanged.
        proxy_ssl_server_name       on;
        proxy_ssl_name              hotbox.thekrystalship.com;
        proxy_ssl_verify            on;
        proxy_ssl_verify_depth      3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # The assistant's streams: a turn's server-sent events, which can sit quiet while the model
    # works, and the event stream a page holds open. Buffering is off so each frame arrives when it
    # is written, and the read timeout outlasts a page left open.
    location /assistant/ {
        proxy_pass         https://moviebot_hotbox;
        proxy_http_version 1.1;

        # The upstream is an address, so the name to ask for and check against has to be stated.
        # Verification is on: an unverified proxy_ssl encrypts the hop and authenticates nobody.
        # hotbox answers under its own name, so that is the name checked; the vhost on the far
        # side is selected by the Host header, which travels through unchanged.
        proxy_ssl_server_name       on;
        proxy_ssl_name              hotbox.thekrystalship.com;
        proxy_ssl_verify            on;
        proxy_ssl_verify_depth      3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # The API, and the player it serves from wwwroot.
    location / {
        proxy_pass         https://moviebot_hotbox;
        proxy_http_version 1.1;

        # The upstream is an address, so the name to ask for and check against has to be stated.
        # Verification is on: an unverified proxy_ssl encrypts the hop and authenticates nobody.
        # hotbox answers under its own name, so that is the name checked; the vhost on the far
        # side is selected by the Host header, which travels through unchanged.
        proxy_ssl_server_name       on;
        proxy_ssl_name              hotbox.thekrystalship.com;
        proxy_ssl_verify            on;
        proxy_ssl_verify_depth      3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        proxy_read_timeout 120s;
    }
}
