# moviebot — public vhost for the shared-playback player and its API.
#
# One origin serves the page, the API, the media and the SignalR hub. That is deliberate: a
# Discord Activity reaches everything through Discord's proxy under declared URL mappings, and
# a single origin means a single mapping rather than a set that drifts apart.
#
# The certificate is the host's shared lineage, named for the first hostname ever issued on it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name movies.thekrystalship.com;

    # One certificate covers every hostname on this box as SANs; the lineage is named for the
    # first one issued.
    ssl_certificate     /etc/letsencrypt/live/kgsm.thekrystalship.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kgsm.thekrystalship.com/privkey.pem;

    # A film segment is a few megabytes; nothing here is uploaded.
    client_max_body_size 1m;

    # The SignalR hub carrying the room's shared timeline. WebSockets need the upgrade dance,
    # and the read timeout has to outlast a quiet passage of film: the default 60s would drop a
    # connection that is merely watching something without pausing it.
    location /hub/ {
        proxy_pass         http://127.0.0.1:8099;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Playlists, segments, subtitles and posters.
    #
    # Buffering is off because a playlist for a film that is still transcoding grows while it is
    # being read: holding it in a buffer would serve a copy that ends earlier than the file does,
    # which looks to a viewer exactly like a broken transcode. The API sets its own Cache-Control
    # per file — no-store for a growing playlist, immutable for a segment — so nothing here may
    # override it.
    location /media/ {
        proxy_pass         http://127.0.0.1:8099;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # The API, and the player it serves from wwwroot.
    location / {
        proxy_pass         http://127.0.0.1:8099;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        proxy_read_timeout 120s;
    }
}
