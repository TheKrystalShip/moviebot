# Cinema for Android phones, on the TKS shell (shell/, vendored from tks-shell; shell/build.sh
# says what each of these is). The app id is the one every install was made under, so it never
# changes; the mark is how the site knows it runs inside the app.
APP_ID="com.thekrystalship.cinema.phone"
MARK="KrystalCinemaApp"
ORIGIN="https://movies.thekrystalship.com"
ARTIFACT="krystal-cinema-phone"
FEATURES="downloads"
